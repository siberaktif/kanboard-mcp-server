[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanboard-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Kanboard JSON-RPC API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0"
]

[project.scripts]
kanboard-mcp = "kanboard_mcp_server:main"
